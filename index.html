<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سەختەکار (Pro)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #ffca28; /* Gold */
            --text-color: #ffffff;
            --danger-color: #ef5350;
            --success-color: #66bb6a;
            --disabled-color: #424242;
        }

        body {
            font-family: "Tahoma", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            text-align: center;
            user-select: none;
            direction: rtl;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(255, 202, 40, 0.2);
        }

        h2 { font-size: 1.4rem; margin-bottom: 15px; }
        p { font-size: 1rem; color: #aaa; margin-bottom: 5px; }

        /* Inputs & Selects */
        .control-group {
            margin-bottom: 15px;
            background: var(--card-color);
            padding: 15px;
            border-radius: 12px;
            text-align: right;
            border: 1px solid #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
        }
        
        select:focus { border-color: var(--accent-color); }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--accent-color), #ffb300);
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
            font-family: inherit;
        }

        .btn:active { transform: scale(0.96); }
        
        .btn-danger { background: linear-gradient(135deg, var(--danger-color), #d32f2f); color: white; box-shadow: 0 4px 15px rgba(239, 83, 80, 0.3); }
        .btn-secondary { background: #424242; color: white; box-shadow: none; }
        
        .invisible { opacity: 0; pointer-events: none; }

        /* Card Animation */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin: 20px 0;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Standard */
            -webkit-backface-visibility: hidden; /* Safari */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .card-front {
            background: linear-gradient(135deg, #333, #222);
            border: 2px solid var(--accent-color);
        }

        .card-back {
            background: var(--card-color);
            transform: rotateY(180deg);
            border: 2px solid #555;
        }

        .secret-word {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 15px 0;
            word-wrap: break-word;
        }

        .imposter-text {
            color: var(--danger-color);
            font-size: 2.2rem;
            font-weight: 900;
        }

        /* Timer */
        .timer-display {
            font-size: 5rem;
            font-weight: 800;
            margin: 30px 0;
            direction: ltr;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* Voting System */
        .voting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .vote-btn {
            background-color: #333;
            border: 2px solid #444;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .vote-btn:active { transform: scale(0.95); }

        .vote-btn.found {
            background-color: rgba(102, 187, 106, 0.2);
            border-color: var(--success-color);
            color: var(--success-color);
            pointer-events: none; /* Disable click */
        }

        .vote-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Utility */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: SETUP -->
    <div id="setup-screen" class="container fade-in">
        <h1>🕵️ سەختەکار <span style="font-size:1rem; vertical-align: super; color: #fff; background: red; padding: 2px 6px; border-radius: 4px;">PRO</span></h1>
        
        <div class="control-group">
            <label>👥 ژمارا یاریکەرا</label>
            <select id="playerCount">
                <option value="3">٣</option>
                <option value="4" selected>٤</option>
                <option value="5">٥</option>
                <option value="6">٦</option>
                <option value="7">٧</option>
                <option value="8">٨</option>
                <option value="9">٩</option>
                <option value="10">١٠</option>
                <option value="11">١١</option>
                <option value="12">١٢</option>
            </select>
        </div>

        <div class="control-group">
            <label>🎭 ژمارا فێلبازا (سەختەکار)</label>
            <select id="imposterCount">
                <option value="1">١</option>
                <option value="2">٢</option>
            </select>
        </div>

        <div class="control-group">
            <label>⏳ ماوەیێ یاریێ (خولەک)</label>
            <select id="gameDuration">
                <option value="3" selected>٣ خولەک</option>
                <option value="4">٤ خولەک</option>
                <option value="5">٥ خولەک</option>
                <option value="7">٧ خولەک</option>
                <option value="10">١٠ خولەک</option>
            </select>
        </div>

        <div class="control-group">
            <label>📂 بابەتا هەلبژێرە</label>
            <select id="categorySelect">
                <option value="random">🎲 هەمی (Random)</option>
                <!-- JS will fill this -->
            </select>
        </div>

        <button class="btn" onclick="initGame()">دەستپێبکە</button>
    </div>

    <!-- SCREEN 2: PASS DEVICE -->
    <div id="pass-screen" class="container hidden">
        <h2>دورا یاریکەرێ</h2>
        <div style="font-size: 5rem; font-weight: bold; color: var(--accent-color); margin: 20px 0;" id="player-number-display">١</div>
        <p>موبایلێ بدە ڤی کەسی</p>
        <div style="margin: 30px 0; font-size: 4rem;">📱🔄🧔</div>
        <button class="btn" onclick="showRevealScreen()">ئەز ئامادەمە</button>
    </div>

    <!-- SCREEN 3: REVEAL ROLE -->
    <div id="reveal-screen" class="container hidden">
        <h2>رولێ خۆ ببینە</h2>
        <p>ل سەر کارتێ بدە دا بزڤڕیت</p>
        
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="game-card">
                <div class="card-face card-front">
                    <span style="font-size: 4rem;">❓</span>
                    <p style="font-size: 1.5rem;">لێدە</p>
                </div>
                <div class="card-face card-back">
                    <div class="role-title" id="role-label">رولێ تە</div>
                    <div class="secret-word" id="secret-word-display">...</div>
                    <p style="font-size: 1rem; margin-top:10px; opacity: 0.7;">(بلا کەسێ دی نەبینیت!)</p>
                </div>
            </div>
        </div>

        <button class="btn btn-secondary invisible" id="next-player-btn" onclick="nextTurn()">ڤەشێرە & دەرباز بکە</button>
    </div>

    <!-- SCREEN 4: TIMER LOOP -->
    <div id="game-screen" class="container hidden">
        <h2>🗣️ دەستپێبکەن!</h2>
        <p>بابەت: <span id="game-category-display" style="color:var(--accent-color); font-weight:bold; font-size:1.2rem;">-</span></p>
        
        <div class="timer-display" id="timer">0:00</div>
        
        <button class="btn btn-danger" onclick="startVoting()">داوی & دەنگدان</button>
    </div>

    <!-- SCREEN 5: VOTING -->
    <div id="voting-screen" class="container hidden">
        <h2>🗳️ دەنگدان</h2>
        <p id="voting-instruction">فێلباز کییە؟ دەنگی بدەنە کەسەکی</p>
        
        <div id="status-message-area"></div>

        <div id="voting-buttons" class="voting-grid">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- SCREEN 6: RESULTS -->
    <div id="result-screen" class="container hidden">
        <h1 id="win-status" style="font-size: 2.5rem; margin-bottom: 20px;"></h1>
        
        <div class="control-group">
            <label>پەیڤا ڤەشارتی:</label>
            <h2 style="color: var(--success-color); font-size: 2rem;" id="final-word">...</h2>
        </div>

        <div class="control-group">
            <label>😈 فێلباز:</label>
            <div id="imposter-list" style="font-size: 1.5rem; font-weight:bold; color: var(--danger-color);"></div>
        </div>

        <button class="btn" onclick="location.reload()">یاریەکا نوی</button>
    </div>

    <script>
        // --- HUGE DATABASE ---
        const database = [
            {
                name: "باژێر (Cities)",
                words: ["دهوک", "زاخو", "هەولێر", "سلێمانی", "کەرکوک", "ئاکرێ", "ئامێدی", "ئیستەنبول", "بەغدا", "پاریس", "لەندەن", "دوبەی", "بەرلین", "موسل", "شێلادزێ"]
            },
            {
                name: "خوارن (Food)",
                words: ["کوتلک", "بریانی", "دۆلمە", "کەباب", "سەر و پێ", "کوبە", "شۆربا نیسکا", "پیتزا", "ساوار", "گۆشتێ مریشکا", "مەقلووبە", "هەمبەرگەر", "یاپراخ", "مەسکوف"]
            },
            {
                name: "سترانبێژ (Singers)",
                words: ["زەکەریا", "عبدالقەهار زاخوی", "بلند ئیبراهیم", "شڤان پەروەر", "خێرۆ عەباس", "دەشتی کالێ", "چۆپی فەتاح", "عەبدولواحید زاخوی", "جەستن بیبەر", "شاکیرا", "ئەدێل", "ئەحمەد خەلیل"]
            },
            {
                name: "یانێن تەپا پێ (Football Teams)",
                words: ["بەرشەلۆنە", "ریال مەدرید", "مانچێستەر یونایتد", "لیڤەرپول", "بایرن میونخ", "پاریس سانجێرمان", "یۆڤێنتۆس", "میلان", "دهوک", "ئەرسیناڵ", "مانچێستەر سیتی", "شورتە"]
            },
            {
                name: "یاریکەرێن جیهانی (Players)",
                words: ["مێسی", "رۆناڵدۆ", "نەیمار", "ئەمباپێ", "هالاند", "بێلینگهام", "ڤینیسیۆس", "سەڵاح", "لیڤاندۆڤیسکی", "مۆدریچ", "زێدان", "مارادۆنا"]
            },
            {
                name: "جۆرێن ترۆمبێلا (Cars)",
                words: ["تویۆتا", "مێرسیدس", "بی ئێم دەبلیو (BMW)", "هۆندای", "کیا", "لاند کروزەر", "رەنج رۆڤەر", "فێراری", "نیسان", "جیپ", "فۆرد", "ئۆپڵ"]
            },
            {
                name: "گیانەوەر (Animals)",
                words: ["شێر", "پلنگ", "مار", "کەر", "هەسپ", "پیسیک", "سە (کۆچک)", "گورگ", "کەو", "میهـ", "فیل", "مریشک", "كێڤژالە", "ماسی"]
            },
            {
                name: "جهـ (Places)",
                words: ["قوتابخانە", "نەخۆشخانە", "مزگەفت", "زانکۆ", "فڕۆکەخانە", "ئوتێل", "پارک", "فەرمانگەهـ", "بازاڕ", "ماڵا خەزووری", "سینەما", "کافێ", "باشترین کافێ"]
            },
            {
                name: "تشتێن مالێ (Objects)",
                words: ["تەلەفزیۆن", "سۆبە", "ساردکەر (سەلاجە)", "فراق شو", "موبایل", "تەختێ خەوێ", "قەنەفە", "مافۆر (خالیچە)", "دەرگەهـ", "پەنجەرە", "ئاوێنە", "جل شۆ"]
            }
        ];

        // --- STATE ---
        let state = {
            players: [], 
            currentPlayerIndex: 0,
            secretWord: "",
            category: "",
            timerInterval: null,
            totalImposters: 0,
            foundImpostersCount: 0
        };

        const arabicNumerals = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        function toArabicNum(n) {
            return n.toString().replace(/\d/g, d => arabicNumerals[d]);
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            const catSelect = document.getElementById('categorySelect');
            database.forEach((cat, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.innerText = cat.name;
                catSelect.appendChild(option);
            });
        };

        function initGame() {
            const pCount = parseInt(document.getElementById('playerCount').value);
            const iCount = parseInt(document.getElementById('imposterCount').value);
            const duration = parseInt(document.getElementById('gameDuration').value);
            const catVal = document.getElementById('categorySelect').value;

            if (iCount >= pCount - 1) { // Must have at least 2 citizens
                alert("خەلەتی: ژمارا فێلبازا گەلەکە!");
                return;
            }

            // Setup Category
            let selectedCategory;
            if (catVal === 'random') {
                selectedCategory = database[Math.floor(Math.random() * database.length)];
            } else {
                selectedCategory = database[parseInt(catVal)];
            }
            
            state.category = selectedCategory.name;
            state.secretWord = selectedCategory.words[Math.floor(Math.random() * selectedCategory.words.length)];
            state.totalImposters = iCount;
            state.foundImpostersCount = 0;
            state.gameDuration = duration;

            // Build Roles
            let roles = Array(pCount).fill("وەلاتی");
            for(let i=0; i<iCount; i++) roles[i] = "سەختەکار";
            roles.sort(() => Math.random() - 0.5);

            state.players = roles.map((role, index) => ({
                id: index + 1,
                role: role,
                isFound: false
            }));
            state.currentPlayerIndex = 0;

            switchScreen('setup-screen', 'pass-screen');
            updatePassScreen();
        }

        // --- NAVIGATION ---
        function updatePassScreen() {
            document.getElementById('player-number-display').innerText = toArabicNum(state.players[state.currentPlayerIndex].id);
        }

        function showRevealScreen() {
            const card = document.getElementById('game-card');
            card.classList.remove('flipped');
            document.getElementById('next-player-btn').classList.add('invisible');

            const currentPlayer = state.players[state.currentPlayerIndex];
            const wordDisplay = document.getElementById('secret-word-display');
            const roleLabel = document.getElementById('role-label');

            if (currentPlayer.role === "سەختەکار") {
                roleLabel.innerText = "رولێ تە:";
                wordDisplay.innerText = "فێلباز (سەختەکار)";
                wordDisplay.className = "secret-word imposter-text";
            } else {
                roleLabel.innerText = "پەیڤا تە:";
                wordDisplay.innerText = state.secretWord;
                wordDisplay.className = "secret-word";
                wordDisplay.style.color = "var(--accent-color)";
            }
            switchScreen('pass-screen', 'reveal-screen');
        }

        function flipCard() {
            document.getElementById('game-card').classList.add('flipped');
            const nextBtn = document.getElementById('next-player-btn');
            nextBtn.classList.remove('invisible');
            nextBtn.classList.add('fade-in');
        }

        function nextTurn() {
            state.currentPlayerIndex++;
            if (state.currentPlayerIndex >= state.players.length) {
                startGameTimer();
            } else {
                switchScreen('reveal-screen', 'pass-screen');
                updatePassScreen();
            }
        }

        // --- TIMER ---
        function startGameTimer() {
            switchScreen('reveal-screen', 'game-screen');
            document.getElementById('game-category-display').innerText = state.category.split('(')[0];
            
            let duration = state.gameDuration * 60;
            const timerDisplay = document.getElementById('timer');
            
            // Immediate render
            let m = Math.floor(duration / 60);
            let s = duration % 60;
            timerDisplay.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

            state.timerInterval = setInterval(() => {
                duration--;
                let m = Math.floor(duration / 60);
                let s = duration % 60;
                timerDisplay.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

                if (duration <= 0) {
                    clearInterval(state.timerInterval);
                    timerDisplay.style.color = "red";
                    timerDisplay.innerText = "0:00";
                    startVoting();
                }
            }, 1000);
        }

        // --- VOTING LOGIC (NEW & IMPROVED) ---
        function startVoting() {
            clearInterval(state.timerInterval);
            switchScreen('game-screen', 'voting-screen');
            renderVotingButtons();
        }

        function renderVotingButtons() {
            const container = document.getElementById('voting-buttons');
            container.innerHTML = '';

            state.players.forEach(player => {
                const btn = document.createElement('button');
                btn.className = 'vote-btn';
                btn.innerText = `یاریکەر ${toArabicNum(player.id)}`;
                
                if (player.isFound) {
                    btn.classList.add('found');
                    btn.innerText += " (گیرای)";
                } else {
                    btn.onclick = () => checkVote(player.id, btn);
                }
                
                container.appendChild(btn);
            });
        }

        function checkVote(selectedPlayerId, btnElement) {
            const selectedPlayer = state.players.find(p => p.id === selectedPlayerId);
            const msgArea = document.getElementById('status-message-area');

            // 1. If user selects a CITIZEN (Wrong Guess) -> GAME OVER immediately
            if (selectedPlayer.role === "وەلاتی") {
                endGame(false); // Citizens Lose
                return;
            }

            // 2. If user selects an IMPOSTER (Correct Guess)
            if (selectedPlayer.role === "سەختەکار") {
                selectedPlayer.isFound = true; // Mark as found
                state.foundImpostersCount++;

                // Update UI
                btnElement.classList.add('found');
                btnElement.innerText += " (گیرای)";
                
                // Check if ALL imposters are found
                if (state.foundImpostersCount === state.totalImposters) {
                    endGame(true); // Citizens Win
                } else {
                    // Game continues, must find the other one
                    msgArea.innerHTML = `<div class="status-msg" style="background:rgba(102, 187, 106, 0.2); color:#66bb6a;">✅ ئافەرم! تە ئێک گرت. یێ دی ژی ببینە!</div>`;
                    renderVotingButtons(); // Re-render to disable the button
                }
            }
        }

        function endGame(citizensWon) {
            switchScreen('voting-screen', 'result-screen');
            const winStatus = document.getElementById('win-status');

            if (citizensWon) {
                winStatus.innerText = "🎉 هەوە برد! (هەمی فێلباز گیران)";
                winStatus.style.color = "var(--success-color)";
            } else {
                winStatus.innerText = "❌ هەوە دۆڕاند (فێلباز سەرکەفت)";
                winStatus.style.color = "var(--danger-color)";
            }

            document.getElementById('final-word').innerText = state.secretWord;
            
            const imposterIds = state.players
                .filter(p => p.role === "سەختەکار")
                .map(p => `یاریکەر ${toArabicNum(p.id)}`)
                .join("، ");
            
            document.getElementById('imposter-list').innerText = imposterIds;
        }

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            const toEl = document.getElementById(toId);
            toEl.classList.remove('hidden');
            toEl.classList.add('fade-in');
            setTimeout(() => toEl.classList.remove('fade-in'), 500);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FakeIt Badini</title>
    <style>
        /* --- DESIGN SYSTEM (Smooth Dark Theme) --- */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --accent-color: #fbbf24; /* Amber Gold */
            --accent-glow: rgba(251, 191, 36, 0.3);
            --danger-color: #ef4444; /* Red */
            --success-color: #10b981; /* Green */
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Tahoma", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            text-align: center;
            margin: 10px 0 5px 0;
            font-weight: 900;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        h2 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; font-weight: bold; }
        p { color: var(--text-secondary); text-align: center; margin-bottom: 10px; font-size: 0.95rem; }

        /* --- CARDS & PANELS --- */
        .glass-card {
            background: var(--surface-color);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .control-group { margin-bottom: 15px; text-align: right; }
        label { display: block; color: var(--accent-color); font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }

        select {
            width: 100%;
            padding: 14px;
            background: #27272a;
            color: white;
            border: 2px solid #3f3f46;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }
        select:focus { border-color: var(--accent-color); }

        /* --- BUTTONS --- */
        .btn {
            background: linear-gradient(135deg, var(--accent-color), #d97706);
            color: #000;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.1s;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.97); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .btn-outline { background: transparent; border: 2px solid #3f3f46; color: var(--text-secondary); box-shadow: none; }

        /* --- 3D CARD ANIMATION --- */
        .scene {
            width: 100%;
            height: 300px;
            perspective: 1000px;
            margin: 20px 0;
            cursor: pointer;
        }

        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-object.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .face-front {
            background: linear-gradient(145deg, #27272a, #18181b);
            border: 2px solid var(--accent-color);
        }

        .face-back {
            background: #18181b;
            transform: rotateY(180deg);
            border: 2px solid white;
        }

        .role-text { font-size: 2.5rem; font-weight: 900; margin: 15px 0; text-align: center; }
        .text-imposter { color: var(--danger-color); }
        .text-citizen { color: var(--success-color); }

        /* --- FILTER LIST --- */
        .filter-container {
            max-height: 120px;
            overflow-y: auto;
            background: #121212;
            border-radius: 12px;
            padding: 5px;
            border: 1px solid #333;
        }
        .filter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #222;
        }
        .filter-item:last-child { border-bottom: none; }
        input[type="checkbox"] { accent-color: var(--accent-color); width: 20px; height: 20px; }

        /* --- VOTING GRID --- */
        .vote-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .vote-btn {
            background: #27272a;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .vote-btn:active { transform: scale(0.95); }
        .vote-btn.caught { background: var(--success-color); color: black; border-color: var(--success-color); opacity: 0.5; pointer-events: none; }

        /* --- UTILS --- */
        .hidden { display: none !important; }
        .invisible { opacity: 0; pointer-events: none; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SCREEN 1: SETUP -->
        <div id="screen-setup" class="fade-in">
            <h1>سەختەکار <span style="font-size:0.5em; vertical-align: super; background:var(--danger-color); color:white; padding:2px 6px; border-radius:4px;"></span></h1>
            <p>کی سەختەکارە!</p>

            <div class="glass-card">
                <div class="control-group">
                    <label>👥 ژمارا یاریکەرا</label>
                    <select id="playerCount">
                        <option value="3">٣</option>
                        <option value="4" selected>٤</option>
                        <option value="5">٥</option>
                        <option value="6">٦</option>
                        <option value="7">٧</option>
                        <option value="8">٨</option>
                        <option value="9">٩</option>
                        <option value="10">١٠</option>
                        <option value="11">١١</option>
                        <option value="12">١٢</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>🎭 ژمارا فێلبازا (سەختەکار)</label>
                    <select id="imposterCount">
                        <option value="1">١</option>
                        <option value="2">٢</option>
                        <option value="3">٣</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>⏳ ماوەیێ یاریێ (دەقە)</label>
                    <select id="duration">
                        <option value="3">٣ خولەک</option>
                        <option value="4">٤ خولەک</option>
                        <option value="5" selected>٥ خولەک</option>
                        <option value="7">٧ خولەک</option>
                        <option value="10">١٠ خولەک</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>📂 بابەتا هەلبژێرە</label>
                    <select id="categorySelect">
                        <option value="random">🎲 هەمی (Random)</option>
                        <!-- Filled by JS -->
                    </select>
                </div>

                <div class="control-group">
                    <label>فلتەرکرنا بابەتا (د Random دا)</label>
                    <div id="filterList" class="filter-container">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>

            <button class="btn" onclick="startGame()">دەستپێبکە</button>
        </div>

        <!-- SCREEN 2: PASS DEVICE -->
        <div id="screen-pass" class="hidden fade-in" style="text-align: center; margin: auto;">
            <h2>دورا یاریکەرێ</h2>
            <div style="font-size: 6rem; font-weight: 900; color: var(--accent-color); margin: 20px 0; text-shadow: 0 0 30px var(--accent-glow);" id="pass-num">١</div>
            <p>موبایلێ بدە ڤی کەسی</p>
            <div style="font-size: 5rem; margin: 30px 0;">📱 ➔ 🧔</div>
            <button class="btn" onclick="revealRole()">ئەز ئامادەمە</button>
        </div>

        <!-- SCREEN 3: REVEAL ROLE -->
        <div id="screen-reveal" class="hidden fade-in">
            <h2 style="margin-top:20px">رولێ خۆ ببینە</h2>
            <p>ل سەر کارتێ بدە دا بزڤڕیت</p>

            <div class="scene" onclick="flipCard()">
                <div class="card-object" id="role-card">
                    <div class="card-face face-front">
                        <div style="font-size: 4rem;">🔒</div>
                        <h3 style="color:var(--accent-color); margin-top:10px;">لێبدە (Tap)</h3>
                    </div>
                    <div class="card-face face-back">
                        <div style="font-size: 0.9rem; opacity: 0.7; letter-spacing: 1px;">رولێ تە</div>
                        <div id="role-text" class="role-text">...</div>
                        <div id="role-hint" style="font-size: 0.9rem; color: #ccc; padding: 0 10px; text-align: center;">...</div>
                    </div>
                </div>
            </div>

            <button id="btn-next" class="btn btn-outline invisible" onclick="nextPlayer()">ڤەشێرە & دەرباز بکە</button>
        </div>

        <!-- SCREEN 4: GAME TIMER -->
        <div id="screen-game" class="hidden fade-in" style="text-align: center; margin: auto;">
            <h2>🗣️ دەستپێبکەن!</h2>
            
            <div class="glass-card" style="display:inline-block; padding: 10px 30px; margin-bottom: 30px;">
                <p style="margin:0; font-size:0.8rem;">بابەت</p>
                <h2 id="game-category-display" style="color:var(--accent-color); margin:0; font-size:1.8rem;">-</h2>
            </div>

            <div style="font-size: 5rem; font-weight: bold; margin-bottom: 40px; font-variant-numeric: tabular-nums;" id="timer-display">0:00</div>

            <button class="btn btn-danger" onclick="startVoting()">داوی & دەنگدان</button>
        </div>

        <!-- SCREEN 5: VOTING -->
        <div id="screen-voting" class="hidden fade-in" style="text-align: center;">
            <h2>🗳️ دەنگدان</h2>
            <p>کێ فێلبازە؟ ل سەر ناڤێ وی بدە</p>
            <div id="vote-status" style="margin: 10px 0; font-weight: bold; min-height: 24px;"></div>
            <div class="vote-grid" id="vote-grid"></div>
        </div>

        <!-- SCREEN 6: RESULTS -->
        <div id="screen-results" class="hidden fade-in" style="text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
            <h1 id="winner-title">...</h1>
            
            <div class="glass-card" style="margin-top:20px;">
                <p style="margin-bottom: 5px;">پەیڤا ڤەشارتی:</p>
                <h2 id="result-word" style="color:var(--success-color); margin:0;">...</h2>
            </div>

            <div class="glass-card" style="text-align: right; max-height: 250px; overflow-y: auto;">
                <p style="font-weight:bold; margin-bottom:10px; color:white;">لیستا رۆڵان:</p>
                <div id="roles-list"></div>
            </div>

            <button class="btn" onclick="location.reload()">یاریەکا نوی</button>
        </div>

    </div>

    <script>
        // --- DATABASE (BADINI CONTENT) ---
        const database = [
            { name: "باژێر (Cities)", words: ["دهوک", "زاخو", "هەولێر", "سلێمانی", "کەرکوک", "ئاکرێ", "ئامێدی", "شێلادزێ", "بەغدا", "موسل", "ئیستەنبول", "پاریس", "دوبەی", "لەندەن", "بەرلین"] },
            { name: "وەلات (Countries)", words: ["کوردستان", "عیراق", "تورکیا", "ئیران", "سوریا", "ئەمەریکا", "ئەلمانیا", "فەرەنسا", "بەریتانیا", "بەرازیل", "ئەرجەنتین", "یابان", "چین", "روسیا"] },
            { name: "خوارن (Food)", words: ["کوتلک", "بریانی", "دۆلمە", "کەباب", "سەر و پێ (پاچە)", "کوبە", "شۆربا نیسکا", "پیتزا", "مەقلوبە", "هەمبەرگەر", "شفتە", "ماسی", "ساوار", "شاورمە", "فەلافل", "گۆشتێ مریشکا", "برنج و فاسولیا"] },
            { name: "سترانبێژ (Singers)", words: ["زەکەریا عەبدوللا", "عەبدولقەهار زاخوی", "بلند ئیبراهیم", "شڤان پەروەر", "خێرۆ عەباس", "ئەحمەد خەلیل", "هەڤال ئیبراهیم", "حەسەن شەریف", "ئەیاز یوسف", "ئەردەوان زاخوی", "تەحسین تەها", "محەمەد شێخۆ", "چۆپی فەتاح", "حەمە جەزا", "ناسر رەزازی"] },
            { name: "کەسایەتی (Famous)", words: ["مێسی", "رۆناڵدۆ", "نەیمار", "ئیلۆن مەسک", "مارک زوکەربێرگ", "بیل گەیتس", "ستیڤ جۆبس", "ئەلبێرت ئەینشتاین", "تۆم کروز", "لیۆناردۆ دیکاپریۆ", "محەمەد عەلی کلای", "شاکیرە", "جەستن بیبەر"] },
            { name: "تەپا پێ (Football)", words: ["بەرشەلۆنە", "ریال مەدرید", "مانچێستەر یونایتد", "مانچێستەر سیتی", "لیڤەرپول", "ئەرسیناڵ", "چێڵسی", "بایرن میونخ", "پاریس سانجێرمان", "یۆڤێنتۆس", "میلان", "ئینتەر", "یانا دهوک", "یانا هەولێر", "هەڵبژاردێ بەرازیل"] },
            { name: "ترۆمبێل (Cars)", words: ["تویۆتا", "مێرسیدس", "BMW", "هۆندای", "کیا", "لاند کروزەر", "رەنج رۆڤەر", "جیپ", "فۆرد", "شۆفرلێت", "نیسان", "فێراری", "لامبۆرگینی", "تێسلا", "دۆج", "ئۆپڵ"] },
            { name: "گیانەوەر (Animals)", words: ["شێر", "پلنگ", "مار", "کەر", "هەسپ", "پیسیک (کتک)", "سە (کۆچک)", "گورگ", "کەو", "میهـ (پەز)", "فیل", "زەرافە", "مەیمون", "هیرچ", "ریڤی", "کەرگۆشک", "گامێش", "ئەیلۆ"] },
            { name: "کار (Jobs)", words: ["مامۆستا", "نۆژدار (دکتۆر)", "ئەندازیار", "پۆلیس", "پێشمەرگە", "بازرگان", "ئاژۆتڤان (سایەق)", "نانپێژ", "سەرتاش", "وێنەگر", "پارێزەر", "دادوەر", "رۆژنامەڤان", "جوتکار", "کارکەر", "فیتەر", "تەباخ"] },
            { name: "فێکی (Fruits)", words: ["سێڤ", "مۆز", "پرتەقال", "هینار", "تری", "زەبەش (شوتی)", "گندۆر", "هیرمی", "خۆخ", "قەیسی", "توو", "تووفرەنگی", "کیوی", "ئەناناس", "لێمۆن", "خورمە", "هەژیر"] },
            { name: "جهـ (Places)", words: ["قوتابخانە", "نەخۆشخانە", "مزگەفت", "زانکۆ", "فڕۆکەخانە", "ئوتێل", "پارک", "کافێ", "بازاڕ", "مۆڵ", "سینەما", "یاریگەهـ (مەلعەب)", "ماڵا خەزووری", "چایخانە", "رێستۆرانت", "دەریا", "چیا", "دارستان"] },
            { name: "تشتێن مالێ (Objects)", words: ["تەلەفزیۆن", "سۆبە", "سەلاجە", "موبایل", "تەختێ خەوێ", "قەنەفە", "ئاوێنە", "کۆمپیوتەر", "لاپتۆپ", "ئایپاد", "پێنڤیس", "پرتوک", "دەمژمێر", "گلۆپ", "پانکە", "مێز", "کورسی", "دەرگەهـ", "پەنجەرە", "خالیچە"] }
        ];

        // --- STATE ---
        let state = {
            players: [],
            turn: 0,
            secretWord: "",
            category: "",
            timer: null,
            totalImposters: 0,
            foundImposters: 0
        };

        const toArabicNum = n => n.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

        // --- INIT ---
        window.onload = () => {
            const catSelect = document.getElementById('categorySelect');
            const filterList = document.getElementById('filterList');

            database.forEach((cat, i) => {
                // Dropdown
                let opt = document.createElement('option');
                opt.value = i; opt.innerText = cat.name;
                catSelect.appendChild(opt);
                
                // Filter
                let div = document.createElement('div');
                div.className = 'filter-item';
                div.innerHTML = `<label for="c-${i}" style="margin:0; font-weight:normal; color:white; cursor:pointer;">${cat.name}</label><input type="checkbox" id="c-${i}" value="${i}" checked>`;
                filterList.appendChild(div);
            });
        };

        // --- GAME START ---
        function startGame() {
            const pCount = parseInt(document.getElementById('playerCount').value);
            const iCount = parseInt(document.getElementById('imposterCount').value);
            const catVal = document.getElementById('categorySelect').value;

            if (iCount >= pCount) { alert("ژمارا فێلبازا گەلەکە!"); return; }

            // Category Logic
            let catObj;
            if (catVal === 'random') {
                const checks = Array.from(document.querySelectorAll('#filterList input:checked'));
                if(checks.length === 0) { alert("تکایە بابەتەکی هەلبژێرە!"); return; }
                const randomIdx = checks[Math.floor(Math.random() * checks.length)].value;
                catObj = database[randomIdx];
            } else {
                catObj = database[catVal];
            }

            state.category = catObj.name;
            state.secretWord = catObj.words[Math.floor(Math.random() * catObj.words.length)];
            state.totalImposters = iCount;
            state.foundImposters = 0;
            state.turn = 0;

            // Roles Logic
            let roles = Array(pCount).fill("وەلاتی");
            for(let i=0; i<iCount; i++) roles[i] = "سەختەکار";
            roles.sort(() => Math.random() - 0.5);

            state.players = roles.map((r, i) => ({ id: i+1, role: r, isFound: false }));

            showScreen('screen-pass');
            updatePassScreen();
        }

        // --- PASS & REVEAL ---
        function updatePassScreen() {
            document.getElementById('pass-num').innerText = toArabicNum(state.players[state.turn].id);
        }

        function revealRole() {
            showScreen('screen-reveal');
            document.getElementById('role-card').classList.remove('flipped');
            document.getElementById('btn-next').classList.add('invisible');

            const p = state.players[state.turn];
            const txt = document.getElementById('role-text');
            const hint = document.getElementById('role-hint');

            if (p.role === "سەختەکار") {
                txt.innerText = "فێلباز\n(سەختەکار)";
                txt.className = "role-text text-imposter";
                hint.innerText = "هەول بدە بزانی بابەت چییە و خۆ نەدە دەست!";
            } else {
                txt.innerText = state.secretWord;
                txt.className = "role-text text-citizen";
                hint.innerText = `بابەت: ${state.category.split('(')[0]}`;
            }
        }

        function flipCard() {
            document.getElementById('role-card').classList.add('flipped');
            document.getElementById('btn-next').classList.remove('invisible');
        }

        function nextPlayer() {
            state.turn++;
            if (state.turn < state.players.length) {
                showScreen('screen-pass');
                updatePassScreen();
            } else {
                runTimer();
            }
        }

        // --- TIMER ---
        function runTimer() {
            showScreen('screen-game');
            document.getElementById('game-category-display').innerText = state.category.split('(')[0];

            let min = parseInt(document.getElementById('duration').value);
            let sec = 0;
            const display = document.getElementById('timer-display');
            display.innerText = `${min}:00`;

            if (state.timer) clearInterval(state.timer);
            state.timer = setInterval(() => {
                if (sec === 0) {
                    if (min === 0) {
                        clearInterval(state.timer);
                        display.style.color = "var(--danger-color)";
                        startVoting();
                        return;
                    }
                    min--; sec = 59;
                } else {
                    sec--;
                }
                display.innerText = `${min}:${sec < 10 ? '0'+sec : sec}`;
            }, 1000);
        }

        // --- VOTING ---
        function startVoting() {
            clearInterval(state.timer);
            showScreen('screen-voting');
            
            const grid = document.getElementById('vote-grid');
            grid.innerHTML = '';
            document.getElementById('vote-status').innerText = "";

            state.players.forEach(p => {
                let btn = document.createElement('button');
                btn.className = 'vote-btn';
                btn.innerText = `یاریکەر ${toArabicNum(p.id)}`;
                
                if (p.isFound) {
                    btn.classList.add('caught');
                    btn.innerText += " (گیرای)";
                } else {
                    btn.onclick = () => handleVote(p, btn);
                }
                grid.appendChild(btn);
            });
        }

        function handleVote(player, btn) {
            const status = document.getElementById('vote-status');

            if (player.role === "وەلاتی") {
                endGame(false); // Imposters Win immediately
            } else {
                // Found Imposter
                player.isFound = true;
                state.foundImposters++;
                btn.classList.add('caught');
                btn.innerText += " (گیرای)";

                if (state.foundImposters >= state.totalImposters) {
                    endGame(true); // Citizens Win
                } else {
                    status.innerHTML = `<span style="color:var(--success-color)">✅ ئافەرم! تە ئێک گرت. یێ دی ژی ببینە.</span>`;
                }
            }
        }

        // --- RESULTS ---
        function endGame(citizensWin) {
            showScreen('screen-results');
            const title = document.getElementById('winner-title');
            
            if (citizensWin) {
                title.innerText = "وەلاتیان برد! 🎉";
                title.style.color = "var(--success-color)";
            } else {
                title.innerText = "فێلبازان برد! 😈";
                title.style.color = "var(--danger-color)";
            }

            document.getElementById('result-word').innerText = state.secretWord;

            const list = document.getElementById('roles-list');
            list.innerHTML = '';
            state.players.forEach(p => {
                let div = document.createElement('div');
                div.style.padding = "10px 0";
                div.style.borderBottom = "1px solid rgba(255,255,255,0.1)";
                div.style.display = "flex";
                div.style.justifyContent = "space-between";
                
                let color = p.role === "سەختەکار" ? "var(--danger-color)" : "var(--success-color)";
                let name = p.role === "سەختەکار" ? "فێلباز" : "وەلاتی";

                div.innerHTML = `
                    <span>یاریکەر ${toArabicNum(p.id)}</span> 
                    <span style="color:${color}; font-weight:bold;">${name}</span>
                `;
                list.appendChild(div);
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.app-container > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
